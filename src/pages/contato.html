<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Entre em contato com a Vinharia Agnello. Envie sua mensagem através do nosso formulário.">
    <meta name="keywords" content="Vinharia Agnello, contato, vinhos, vinharia">

    <title>Contato | Vinharia Agnello</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Vinharia Agnello</h1>

        <nav>
            <a href="../../index.html">Início</a>
            <a href="historia.html">História</a>
            <a href="produtos.html">Produtos</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <h2>Entre em contato conosco</h2>

        <p>
            Preencha o formulário abaixo e nossa equipe entrará em contato!
        </p>

        <img src="../assets/imgs/fachada-vinhos-galeria.avif" alt="Fachada da Vinharia Agnello">

        <section>
            <h3>Fale conosco</h3>

            <form action="">

                <fieldset>

                    <label for="nome">Nome Completo:</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Digite aqui..." 
                        required
                    >

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="exemplo@exemplo.com" 
                        required
                    >

                    <br><br>

                    <label for="motivo">Mensagem:</label>
                    <br>

                    <textarea 
                        id="motivo" 
                        name="contato" 
                        placeholder="Digite sua mensagem..."
                    ></textarea>

                    <br><br>

                    <button type="submit">Enviar</button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Vinharia Agnello - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
